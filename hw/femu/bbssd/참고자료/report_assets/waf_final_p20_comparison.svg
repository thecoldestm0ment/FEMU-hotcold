  <text x="450" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4b5563">3600 s, Zipf 0.99, seed 20260824 (single run)</text>

  <line x1="105" y1="410" x2="850" y2="410" stroke="#111827" stroke-width="2"/>
  <line x1="105" y1="90" x2="105" y2="410" stroke="#111827" stroke-width="2"/>

  <g font-family="sans-serif" font-size="13" fill="#4b5563" text-anchor="end">
