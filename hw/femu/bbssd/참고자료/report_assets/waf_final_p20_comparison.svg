    <text x="95" y="274">4</text>
    <text x="95" y="204">6</text>
    <text x="95" y="134">8</text>
  </g>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="105" y1="340" x2="850" y2="340"/>
    <line x1="105" y1="270" x2="850" y2="270"/>
    <line x1="105" y1="200" x2="850" y2="200"/>
    <line x1="105" y1="130" x2="850" y2="130"/>
  </g>

  <rect x="165" y="130.34" width="150" height="279.66" rx="5" fill="#6b7280"/>
  <rect x="375" y="165.98" width="150" height="244.02" rx="5" fill="#2563eb"/>
  <rect x="585" y="163.47" width="150" height="246.53" rx="5" fill="#ea580c"/>

  <g font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">
    <text x="240" y="118">7.990</text>
    <text x="450" y="154">6.972</text>
    <text x="660" y="151">7.044</text>
